name: Construir APK móvil

# Genera el instalador Android (.apk) de la app móvil local (carpeta movil/).
# No necesita servidor ni Android SDK en tu computadora: todo se compila aquí,
# en GitHub. Al terminar, el .apk queda descargable en la pestaña "Actions"
# de este repositorio, dentro del run correspondiente, en "Artifacts".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'movil/**'
      - '.github/workflows/build-apk-movil.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web (vite build)
        run: npm run build

      - name: Agregar la plataforma Android (Capacitor)
        run: npx cap add android

      - name: Permisos Android (cámara, galería, ubicación, llamadas)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CALL_PHONE" />\n    <application#' "$M"
          # largeHeap: las fotos se guardan como texto base64 y sin esto Android
          # mata la pantalla por falta de memoria (devolvía al usuario al inicio).
          sed -i 's#<application#<application android:largeHeap="true"#' "$M"
          echo "Permisos declarados: $(grep -c uses-permission "$M")"
          grep -o 'largeHeap="true"' "$M"

      - name: Ícono y splash con el logo de Casa Mamá Emma
        continue-on-error: true
        run: |
          node scripts/generar-iconos.mjs
          npx capacitor-assets generate --android --iconBackgroundColor '#0f766e' --iconBackgroundColorDark '#134e4a' --splashBackgroundColor '#0f766e' --splashBackgroundColorDark '#134e4a'

      - name: Sincronizar assets web -> Android
        run: npx cap sync android

      - name: Compilar el .apk (firma de depuración, instalable directo)
        working-directory: movil/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CasaMamaEmma-Movil-apk
          path: movil/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
